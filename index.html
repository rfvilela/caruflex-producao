<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CaruFlex Produção</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F4F6F4;
  --surface:#FFFFFF;
  --surface-2:#EAEEEA;
  --border:#D9DFDA;
  --text:#161F27;
  --text-muted:#5B6873;
  --accent:#1C5D7A;
  --accent-strong:#123F52;
  --accent-soft:#E4EEF2;
  --success:#2E7D5B;
  --success-soft:#E4F3EC;
  --warning:#B5790A;
  --warning-soft:#FBF0DC;
  --danger:#B23A34;
  --danger-soft:#FBE7E5;
  --shadow: 0 1px 2px rgba(20,30,38,.06), 0 4px 16px rgba(20,30,38,.05);
  --radius: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111820; --surface:#1A232C; --surface-2:#212C35; --border:#333F4A; --text:#E8EEF2; --text-muted:#9AAAB6;
    --accent:#5FB2D6; --accent-strong:#8CCBE5; --accent-soft:#1E3540; --success:#4FBE8A; --success-soft:#173028;
    --warning:#E3AC48; --warning-soft:#332711; --danger:#E2726C; --danger-soft:#3A1E1C;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35); color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111820; --surface:#1A232C; --surface-2:#212C35; --border:#333F4A; --text:#E8EEF2; --text-muted:#9AAAB6;
  --accent:#5FB2D6; --accent-strong:#8CCBE5; --accent-soft:#1E3540; --success:#4FBE8A; --success-soft:#173028;
  --warning:#E3AC48; --warning-soft:#332711; --danger:#E2726C; --danger-soft:#3A1E1C;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35); color-scheme: dark;
}
*{box-sizing:border-box;}
html,body{background:var(--bg);}
body{
  margin:0; color:var(--text);
  font-family:"Inter",system-ui,-apple-system,sans-serif;
  font-size:15px; line-height:1.5;
  padding-bottom:env(safe-area-inset-bottom);
}
h1,h2,h3{font-family:"Sora",system-ui,sans-serif; text-wrap:balance; margin:0;}
button{font-family:inherit;}
::selection{background:var(--accent-soft);}
input,select,textarea{
  font-family:inherit; font-size:15px; color:var(--text); background:var(--surface);
  border:1px solid var(--border); border-radius:9px; padding:9px 11px; width:100%;
}
input:focus,select:focus,textarea:focus,button:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
label{display:block; font-size:12.5px; font-weight:600; color:var(--text-muted); margin:0 0 5px; letter-spacing:.02em;}
.field{margin-bottom:14px;}
.row{display:flex; gap:12px; flex-wrap:wrap;}
.row > .field{flex:1 1 160px;}
button.btn{ border:none; border-radius:10px; padding:10px 16px; font-weight:600; font-size:14.5px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
.btn-primary{background:var(--accent); color:#fff;}
.btn-primary:hover{background:var(--accent-strong);}
.btn-ghost{background:transparent; color:var(--accent); border:1px solid var(--border);}
.btn-ghost:hover{background:var(--surface-2);}
.btn-danger{background:var(--danger-soft); color:var(--danger);}
.btn-success{background:var(--success); color:#fff;}
.btn-block{width:100%; justify-content:center;}
.btn-sm{padding:7px 12px; font-size:13.5px; border-radius:8px;}
a{color:var(--accent);}
#app{min-height:100vh; display:flex; flex-direction:column;}
.topbar{ position:sticky; top:0; z-index:20; background:var(--surface); border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; padding:10px 18px; gap:12px; }
.brand{display:flex; align-items:center; gap:9px;}
.brand-mark{ width:34px; height:34px; border-radius:9px; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-family:"Sora"; font-weight:800; font-size:15px; flex-shrink:0; }
.brand-text{font-family:"Sora"; font-weight:700; font-size:16.5px; letter-spacing:-.01em;}
.brand-sub{font-size:11.5px; color:var(--text-muted); margin-top:-2px;}
.brand-logo{height:30px; width:auto; display:block;}
.login-logo .brand-logo{height:50px;}
.logo-for-dark{display:none;}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .logo-for-light{display:none;}
  :root:not([data-theme="light"]) .logo-for-dark{display:block;}
}
:root[data-theme="dark"] .logo-for-light{display:none;}
:root[data-theme="dark"] .logo-for-dark{display:block;}
.user-chip{display:flex; align-items:center; gap:10px; font-size:13.5px;}
.user-chip .who{text-align:right; line-height:1.25;}
.user-chip .name{font-weight:600;}
.user-chip .setor{color:var(--text-muted); font-size:11.5px; text-transform:uppercase; letter-spacing:.05em;}
.avatar{ width:32px; height:32px; border-radius:50%; background:var(--accent-soft); color:var(--accent-strong); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex-shrink:0; }
nav.tabs{ display:flex; gap:4px; padding:8px 14px; background:var(--surface); border-bottom:1px solid var(--border); overflow-x:auto; -webkit-overflow-scrolling:touch; }
nav.tabs .tab{ border:none; background:transparent; color:var(--text-muted); padding:9px 14px; border-radius:9px; font-weight:600; font-size:13.5px; cursor:pointer; white-space:nowrap; display:flex; align-items:center; gap:6px; }
nav.tabs .tab.active{background:var(--accent-soft); color:var(--accent-strong);}
nav.tabs .tab .count, .filter-row .count{ background:var(--danger); color:#fff; font-size:10.5px; font-weight:700; border-radius:99px; padding:1px 6px; min-width:16px; text-align:center; display:inline-block; }
main{flex:1; padding:18px; max-width:1000px; width:100%; margin:0 auto;}
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px;}
.section-title{font-size:18px; font-weight:700; margin-bottom:4px;}
.section-sub{color:var(--text-muted); font-size:13.5px; margin-bottom:16px;}
.stack{display:flex; flex-direction:column; gap:14px;}
.chip{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:99px; text-transform:uppercase; letter-spacing:.03em;}
.chip-enviado{background:var(--accent-soft); color:var(--accent-strong);}
.chip-recebido{background:var(--warning-soft); color:var(--warning);}
.chip-concluido{background:var(--success-soft); color:var(--success);}
.chip-baixo{background:var(--danger-soft); color:var(--danger);}
.chip-ok{background:var(--success-soft); color:var(--success);}
.order-card{border:1px solid var(--border); border-radius:12px; padding:14px 16px; background:var(--surface); position:relative; overflow:hidden; cursor:pointer; transition:box-shadow .15s ease;}
.order-card:hover{box-shadow:0 2px 10px rgba(0,0,0,.08);}
.modal-overlay{position:fixed; inset:0; background:rgba(10,14,18,.55); display:flex; align-items:flex-end; justify-content:center; z-index:50; opacity:0; transition:opacity .15s ease;}
.modal-overlay.show{opacity:1;}
.modal-overlay[hidden]{display:none;}
.modal-box{background:var(--surface); border-radius:16px 16px 0 0; max-width:560px; width:100%; max-height:88vh; overflow-y:auto; padding:20px 20px 24px; box-shadow:0 -6px 24px rgba(0,0,0,.18); transform:translateY(16px); transition:transform .15s ease;}
.modal-overlay.show .modal-box{transform:translateY(0);}
@media (min-width:640px){
  .modal-overlay{align-items:center;}
  .modal-box{border-radius:16px; margin:16px;}
}
.modal-head{display:flex; align-items:flex-start; gap:10px; margin-bottom:14px;}
.modal-head > div:first-child{flex:1;}
.modal-close{background:none; border:none; font-size:22px; line-height:1; color:var(--text-muted); cursor:pointer; padding:2px 6px;}
.modal-close:hover{color:var(--text);}
.detalhe-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px 16px; margin-bottom:14px;}
.detalhe-grid .span2{grid-column:1 / -1;}
.detalhe-grid label{display:block; font-size:11.5px; font-weight:600; color:var(--text-muted); margin-bottom:2px; letter-spacing:.02em;}
.detalhe-grid > div > div:last-child{font-size:14px;}
.detalhe-item{border:1px solid var(--border); border-radius:10px; padding:8px 10px;}
.detalhe-item-head{display:flex; justify-content:space-between; font-size:14px; gap:10px;}
.detalhe-item-imp{font-size:12.5px; color:var(--text-muted); margin-top:4px;}
@media (max-width:640px){ .detalhe-grid{grid-template-columns:1fr;} }
.order-card::before{content:""; position:absolute; left:0; top:0; bottom:0; width:4px;}
.order-card.st-enviado::before{background:var(--accent);}
.order-card.st-recebido::before{background:var(--warning);}
.order-card.st-concluido::before{background:var(--success);}
.order-head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:8px;}
.order-num{font-weight:700; font-size:15px;}
.order-meta{color:var(--text-muted); font-size:12.5px; margin-top:2px;}
.order-items{font-size:13.5px; color:var(--text); margin:8px 0; display:flex; flex-direction:column; gap:3px;}
.order-items .it{display:flex; justify-content:space-between; gap:8px; border-bottom:1px dashed var(--border); padding:4px 0;}
.order-items .it:last-child{border-bottom:none;}
.qty{font-variant-numeric:tabular-nums; font-weight:600;}
.order-foot{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:10px; flex-wrap:wrap;}
.timeline{font-size:12px; color:var(--text-muted); display:flex; flex-wrap:wrap; gap:10px;}
.stock-table{width:100%; border-collapse:collapse; font-size:13.5px;}
.stock-table th{text-align:left; color:var(--text-muted); font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; padding:8px 10px; border-bottom:1px solid var(--border);}
.stock-table td{padding:9px 10px; border-bottom:1px solid var(--border); vertical-align:middle;}
.stock-table tr:last-child td{border-bottom:none;}
.stock-cat{font-weight:700; font-size:13px; background:var(--surface-2); padding:8px 10px; border-radius:8px; margin:16px 0 6px;}
.qty-cell{font-variant-numeric:tabular-nums; font-weight:700; white-space:nowrap;}
.item-row{border:1px solid var(--border); border-radius:10px; padding:12px; background:var(--surface-2);}
.item-row-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
.item-row-head .idx{font-weight:700; font-size:13px; color:var(--text-muted);}
.login-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
.login-card{max-width:380px; width:100%;}
.login-logo{display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:22px; text-align:center;}
.login-logo .brand-mark{width:52px; height:52px; font-size:22px; border-radius:14px;}
.login-logo h1{font-size:22px;}
.login-logo p{color:var(--text-muted); font-size:13.5px; margin-top:2px;}
.error-msg{background:var(--danger-soft); color:var(--danger); font-size:13.5px; padding:10px 12px; border-radius:9px; margin-bottom:12px;}
.info-banner{background:var(--accent-soft); color:var(--accent-strong); font-size:13px; padding:10px 12px; border-radius:9px; margin-bottom:14px;}
.warn-banner{background:var(--warning-soft); color:var(--warning); font-size:13px; padding:10px 12px; border-radius:9px; margin-bottom:14px;}
.empty-state{text-align:center; padding:40px 20px; color:var(--text-muted);}
.empty-state .glyph{font-size:32px; margin-bottom:8px;}
.filter-row{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px;}
.filter-row button{ border:1px solid var(--border); background:var(--surface); color:var(--text-muted); padding:7px 13px; border-radius:99px; font-size:12.5px; font-weight:600; cursor:pointer; }
.filter-row button.active{background:var(--accent); color:#fff; border-color:var(--accent);}
.hint{font-size:12px; color:var(--text-muted); margin-top:4px;}
.divider{height:1px; background:var(--border); margin:16px 0; border:none;}
.badge-role{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding:2px 8px; border-radius:99px; background:var(--surface-2); color:var(--text-muted);}
.file-input-wrap{border:1.5px dashed var(--border); border-radius:10px; padding:14px; text-align:center; font-size:13px; color:var(--text-muted); background:var(--surface);}
.toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--text); color:var(--bg); padding:11px 18px; border-radius:10px; font-size:13.5px; font-weight:600; box-shadow:var(--shadow); z-index:100; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; max-width:90vw; text-align:center; }
.toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}
.spinner{width:16px; height:16px; border:2px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; display:inline-block;}
@keyframes spin{to{transform:rotate(360deg);}}
@media (prefers-reduced-motion: reduce){ .spinner{animation:none;} }
@media (max-width:680px){
  main{padding:12px 12px 90px;}
  nav.tabs{ position:fixed; bottom:0; left:0; right:0; z-index:30; justify-content:space-around; padding:6px 4px calc(6px + env(safe-area-inset-bottom)); border-top:1px solid var(--border); border-bottom:none; box-shadow:0 -2px 12px rgba(0,0,0,.06); }
  nav.tabs .tab{flex-direction:column; gap:2px; padding:6px 8px; font-size:11px; flex:1;}
  .user-chip .who{display:none;}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<div id="modal-op" class="modal-overlay" hidden><div class="modal-box"></div></div>

<script type="module">
import { initializeApp, deleteApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, collection, query, orderBy, limit, onSnapshot
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

/* =====================================================================
   CONFIGURAÇÃO DO FIREBASE — troque pelos dados do SEU projeto gratuito
   (Firebase Console > Configurações do projeto > Seus apps > Config).
   Sem isso preenchido corretamente o sistema não funciona.
   ===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyBYE-xrd-vw7clZXGLq2wawe1yAN6LFIWY",
  authDomain: "caruflex-producao.firebaseapp.com",
  projectId: "caruflex-producao",
  storageBucket: "caruflex-producao.firebasestorage.app",
  messagingSenderId: "915222490386",
  appId: "1:915222490386:web:198b133b01748b481117cb",
  measurementId: "G-PP2X6LV3W2"
};
const CONFIG_PENDENTE = firebaseConfig.apiKey.indexOf("COLE_AQUI") === 0;

const app = CONFIG_PENDENTE ? null : initializeApp(firebaseConfig);
const auth = CONFIG_PENDENTE ? null : getAuth(app);
const db = CONFIG_PENDENTE ? null : getFirestore(app);

var state = {
  authUser: null, user: null,
  view: "login",
  filtroPedidos: "todos",
  bootstrapNecessario: null,
  cache: { estoque: [], pedidos: [], usuarios: [] },
  arteCache: {},
  loading: true,
  loginError: "", bootstrapError: ""
};

function $(sel, root){ return (root||document).querySelector(sel); }
function el(tag, attrs, html){
  var e = document.createElement(tag);
  if(attrs) for(var k in attrs) e.setAttribute(k, attrs[k]);
  if(html!=null) e.innerHTML = html;
  return e;
}
function esc(s){
  return (s==null?"":String(s)).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function toast(msg){
  var t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove("show"); }, 2600);
}
function slugify(str){
  return (str||"").toString().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,120) || "x";
}
function estoqueId(categoria,cor,tamanho){
  return slugify(categoria)+"__"+slugify(cor||"na")+"__"+slugify(tamanho||"na");
}
function loginParaEmail(login){
  var limpo = (login||"").toString().trim().toLowerCase().replace(/[^a-z0-9._-]/g,"");
  return limpo + "@caruflex.local";
}
function fmtNum(n){ n = Number(n)||0; return n.toLocaleString("pt-BR", {maximumFractionDigits:3}); }
function fmtDate(iso){
  if(!iso) return "—";
  try{ var d = new Date(iso); return d.toLocaleDateString("pt-BR")+" "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}); }
  catch(e){ return iso; }
}
function todayInput(){ return new Date().toISOString().slice(0,10); }
function orderNumero(){
  var d = new Date();
  var ymd = d.getFullYear().toString().slice(2)+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
  var rnd = Math.floor(1000+Math.random()*9000);
  return "OP-"+ymd+"-"+rnd;
}
var CATEGORIAS_PADRAO = [
  "Sacola Boca de Palhaço (Quilo)","Sacola Boca de Palhaço (Milheiro)","Sacola Camiseta",
  "Sacola Alça Fita","Saco Kraft para Delivery","Sacola Kraft Alça Torcida","Saco de Envio",
  "Sacola Boca de Palhaço Metalizada","Sacola Boca de Palhaço Bebidas","Sacolão","Sacola TNT","Diversos"
];
var TAMANHO_MAX_ARTE = 650*1024; // 650KB — margem segura para o limite de 1MiB por documento no Firestore

// ---------- boot ----------
var unsubList = [];
function boot(){
  render();
  if(CONFIG_PENDENTE){ state.loading = false; render(); return; }
  getDoc(doc(db,"meta","bootstrap")).then(function(snap){
    state.bootstrapNecessario = !snap.exists();
    state.loading = false;
    render();
    onAuthStateChanged(auth, function(u){
      state.authUser = u;
      if(u){
        getDoc(doc(db,"perfis",u.uid)).then(function(psnap){
          if(psnap.exists()){
            var d = psnap.data();
            state.user = {uid:u.uid, login:d.login, nome:d.nome, setor:d.setor};
            state.view = defaultViewFor(d.setor);
            if(d.setor==="producao"){ state.filtroPedidos = "enviado"; }
            subscribeAll();
          } else {
            state.user = null;
            signOut(auth);
            state.loginError = "Esta conta não tem um perfil configurado. Fale com o administrador.";
          }
          render();
        });
      } else {
        state.user = null;
        unsubList.forEach(function(u){u();}); unsubList = [];
        render();
      }
    });
  }).catch(function(){ state.loading = false; state.bootstrapNecessario = false; render(); });
}
function defaultViewFor(setor){
  if(setor==="producao") return "pedidos";
  if(setor==="admin") return "pedidos";
  return "novoPedido";
}
function subscribeAll(){
  unsubList.push(onSnapshot(collection(db,"estoque"), function(qs){
    var arr = [];
    qs.forEach(function(d){ arr.push(Object.assign({id:d.id}, d.data())); });
    arr.sort(function(a,b){ return (a.categoria||"").localeCompare(b.categoria||"") || (a.cor||"").localeCompare(b.cor||""); });
    state.cache.estoque = arr; render();
  }));
  unsubList.push(onSnapshot(query(collection(db,"pedidos"), orderBy("criadoEm","desc"), limit(300)), function(qs){
    var arr = [];
    qs.forEach(function(d){ arr.push(Object.assign({id:d.id}, d.data())); });
    state.cache.pedidos = arr; render();
  }));
  unsubList.push(onSnapshot(collection(db,"perfis"), function(qs){
    var arr = [];
    qs.forEach(function(d){ arr.push(Object.assign({uid:d.id}, d.data())); });
    state.cache.usuarios = arr; render();
  }));
}

// ---------- auth ----------
function doBootstrap(login, nome, senha){
  state.bootstrapError = "";
  if(!login || !nome || !senha){ state.bootstrapError = "Preencha todos os campos."; render(); return; }
  var email = loginParaEmail(login);
  createUserWithEmailAndPassword(auth, email, senha).then(function(cred){
    var uid = cred.user.uid;
    return setDoc(doc(db,"perfis",uid), {login:login.trim().toLowerCase(), nome:nome, setor:"admin"})
      .then(function(){ return setDoc(doc(db,"meta","bootstrap"), {criadoEm:new Date().toISOString(), por:login}); });
  }).catch(function(e){
    state.bootstrapError = "Não foi possível criar a conta (" + (e.code||"erro") + "). Tente novamente.";
    render();
  });
}
function doLogin(login, senha){
  if(!login || !senha){ state.loginError = "Preencha usuário e senha."; render(); return; }
  state.loginError = "";
  signInWithEmailAndPassword(auth, loginParaEmail(login), senha).catch(function(){
    state.loginError = "Usuário ou senha inválidos.";
    render();
  });
}
function doLogout(){ signOut(auth); state.view = "login"; }

// ---------- estoque ops ----------
function ajustarEstoque(id, categoria, cor, tamanho, unidade, delta, criarSeNaoExiste){
  var ref = doc(db,"estoque",id);
  return getDoc(ref).then(function(snap){
    if(snap.exists()){
      var novaQtd = (Number(snap.data().quantidade)||0) + delta;
      return updateDoc(ref, {quantidade: novaQtd, atualizadoEm: new Date().toISOString()});
    } else if(criarSeNaoExiste){
      return setDoc(ref, {
        categoria: categoria, cor: cor||"", tamanho: tamanho||"", unidade: unidade||"un",

}

// ---------- render root ----------
function render(){
  var appEl = $("#app");
  appEl.innerHTML = "";
  if(state.loading){
    appEl.appendChild(el("div",{style:"min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:14px;"}, "Carregando CaruFlex Produção…"));
    return;
  }
  if(CONFIG_PENDENTE){ appEl.appendChild(renderConfigPendente()); return; }
  if(state.bootstrapNecessario){ appEl.appendChild(renderBootstrap()); return; }
  if(!state.user){ appEl.appendChild(renderLogin()); return; }
  appEl.appendChild(renderShell());
}

function tabsFor(setor){
  var tabs = [];
  if(setor==="comercial"||setor==="admin") tabs.push({id:"novoPedido", label:"Novo Pedido"});
  tabs.push({id:"pedidos", label:"Pedidos", count: (setor==="producao"||setor==="admin") ? (countByStatus("enviado")+countByStatus("recebido")) : 0});
  tabs.push({id:"estoque", label:"Estoque"});
  if(setor==="admin") tabs.push({id:"admin", label:"Admin"});
  return tabs;
}
function countByStatus(s){ return state.cache.pedidos.filter(function(p){ return p.status===s; }).length; }

// ---------- ESTOQUE ----------
function renderEstoque(){
  var box = el("div", {class:"stack"});
  box.appendChild(el("div", {}, '<div class="section-title">Estoque de sacolas em branco</div><div class="section-sub">Matéria-prima disponível para personalização. Quantidades em vermelho estão no mínimo ou em falta.</div>'));
  var exportBtn = el("button", {class:"btn btn-ghost btn-sm", id:"btn-exportar-estoque", type:"button"}, "Extrair Relatório (PDF)");
  box.appendChild(exportBtn);
  setTimeout(function(){ var b = $("#btn-exportar-estoque"); if(b) b.addEventListener("click", exportarEstoquePdf); }, 0);
  if(state.user.setor==="comercial" || state.user.setor==="admin"){
    var addCard = el("div", {class:"card"});
    addCard.innerHTML =
      '<div class="section-title" style="font-size:15px;margin-bottom:10px;">Registrar entrada / ajuste de estoque</div>' +
      '<form id="form-estoque-add">' +
        '<div class="row">' +
          '<div class="field"><label>Categoria</label><input name="categoria" list="dl-categorias" required></div>' +
          '<div class="field"><label>Cor</label><input name="cor" list="dl-cores"></div>' +
          '<div class="field"><label>Tamanho</label><input name="tamanho" list="dl-tamanhos" placeholder="ex: 30X40"></div>' +
        '</div>' +
        '<div class="row">' +
          '<div class="field"><label>Unidade</label><select name="unidade"><option value="un">Unidades</option><option value="kg">Quilos (kg)</option><option value="milheiro">Milheiro</option></select></div>' +
          '<div class="field"><label>Quantidade a somar (negativo subtrai)</label><input name="quantidade" type="number" step="any" required></div>' +
          '<div class="field"><label>Estoque mínimo (alerta)</label><input name="minimo" type="number" step="any" value="0"></div>' +
        '</div>' +
        '<button class="btn btn-primary" type="submit">Salvar</button>' +
      '</form>' + datalists();
    box.appendChild(addCard);
  }
  var grouped = {};
  state.cache.estoque.forEach(function(it){ (grouped[it.categoria||"Sem categoria"] = grouped[it.categoria||"Sem categoria"]||[]).push(it); });
  var cats = Object.keys(grouped).sort();
  if(cats.length===0){ box.appendChild(el("div",{class:"card empty-state"}, '<div class="glyph">📦</div>Nenhum item de estoque cadastrado ainda.')); return box; }
  var tableCard = el("div", {class:"card"});
  var html = "";
  cats.forEach(function(cat){
    html += '<div class="stock-cat">'+esc(cat)+'</div>';
    html += '<table class="stock-table"><thead><tr><th>Cor</th><th>Tamanho</th><th>Unidade</th><th>Quantidade</th><th></th></tr></thead><tbody>';
    grouped[cat].sort(function(a,b){return (a.cor||"").localeCompare(b.cor||"");}).forEach(function(it){
      var baixo = (Number(it.quantidade)||0) <= (Number(it.minimo)||0);
      var podeEditarEstoque = (state.user.setor==="comercial"||state.user.setor==="admin");
      var acoesEstoque = podeEditarEstoque ?
        '<div style="display:flex;gap:6px;flex-wrap:wrap;">' +
          '<button class="btn btn-ghost btn-sm" data-quick-adjust="'+esc(it.id)+'" type="button">+/−</button>' +
          '<button class="btn btn-ghost btn-sm" data-editar-estoque="'+esc(it.id)+'" type="button">Editar</button>' +
          '<button class="btn btn-danger btn-sm" data-excluir-estoque="'+esc(it.id)+'" type="button">Excluir</button>' +
        '</div>' : "";
      html += '<tr><td>'+esc(it.cor||"—")+'</td><td>'+esc(it.tamanho||"—")+'</td><td>'+esc(it.unidade||"un")+'</td>' +
        '<td class="qty-cell"><span class="chip '+(baixo?"chip-baixo":"chip-ok")+'">'+fmtNum(it.quantidade)+'</span></td>' +
        '<td>'+acoesEstoque+'</td></tr>';
    });
    html += "</tbody></table>";
  });
  tableCard.innerHTML = html;
  box.appendChild(tableCard);
  return box;
}
function datalists(){
  var cats = Array.from(new Set(state.cache.estoque.map(function(i){return i.categoria;}).concat(CATEGORIAS_PADRAO).filter(Boolean)));
  var cores = Array.from(new Set(state.cache.estoque.map(function(i){return i.cor;}).filter(Boolean)));
  var tam = Array.from(new Set(state.cache.estoque.map(function(i){return i.tamanho;}).filter(Boolean)));
  function opts(arr){ return arr.map(function(v){return '<option value="'+esc(v)+'">';}).join(""); }
  return '<datalist id="dl-categorias">'+opts(cats)+'</datalist>' +
         '<datalist id="dl-cores">'+opts(cores)+'</datalist>' +
         '<datalist id="dl-tamanhos">'+opts(tam)+'</datalist>';
}
function abrirEditarEstoque(id){
  var it = state.cache.estoque.filter(function(x){ return x.id===id; })[0];
  if(!it){ toast("Item de estoque não encontrado."); return; }
  var modal = $("#modal-op");
  var box = $(".modal-box", modal);
  box.innerHTML =
    '<div class="modal-head"><div><div class="order-num">Editar item de estoque</div></div>' +
    '<button class="modal-close" type="button" id="modal-op-fechar" aria-label="Fechar">&times;</button></div>' +
    '<form id="form-editar-estoque">' +
      '<div class="row">' +
        '<div class="field"><label>Categoria</label><input name="categoria" list="dl-categorias" required value="'+esc(it.categoria)+'"></div>' +
        '<div class="field"><label>Cor</label><input name="cor" list="dl-cores" value="'+esc(it.cor)+'"></div>' +
      '</div>' +
      '<div class="row">' +
        '<div class="field"><label>Tamanho</label><input name="tamanho" list="dl-tamanhos" value="'+esc(it.tamanho)+'"></div>' +
        '<div class="field"><label>Unidade</label><select name="unidade">' +
          ['un','kg','milheiro'].map(function(u){return '<option value="'+u+'"'+(it.unidade===u?" selected":"")+'>'+(u==='un'?'Unidades':u==='kg'?'Quilos (kg)':'Milheiro')+'</option>';}).join("") +
        '</select></div>' +
      '</div>' +
      '<div class="row">' +
        '<div class="field"><label>Quantidade em estoque</label><input name="quantidade" type="number" step="any" required value="'+esc(it.quantidade)+'"></div>' +
        '<div class="field"><label>Estoque mínimo (alerta)</label><input name="minimo" type="number" step="any" value="'+esc(it.minimo||0)+'"></div>' +
      '</div>' +
      '<div id="editar-estoque-erro" class="error-msg" style="display:none;"></div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;">' +
        '<button class="btn btn-primary" type="submit">Salvar alterações</button>' +
        '<button class="btn btn-ghost" type="button" id="btn-cancelar-edicao-estoque">Cancelar</button>' +
        '<button class="btn btn-danger" type="button" id="btn-excluir-estoque-modal">Excluir este item</button>' +
      '</div>' +
    '</form>' + datalists();
  $("#modal-op-fechar", box).addEventListener("click", fecharModalPedido);
  $("#btn-cancelar-edicao-estoque", box).addEventListener("click", fecharModalPedido);
  $("#btn-excluir-estoque-modal", box).addEventListener("click", function(){ excluirEstoque(id); });
  $("#form-editar-estoque", box).addEventListener("submit", function(e){ e.preventDefault(); salvarEdicaoEstoque(id, box); });
  modal.hidden = false;
  requestAnimationFrame(function(){ modal.classList.add("show"); });
}
function salvarEdicaoEstoque(idAntigo, box){
  var erro = $("#editar-estoque-erro", box);
  erro.style.display = "none";
  var fd = new FormData($("#form-editar-estoque", box));
  var categoria = (fd.get("categoria")||"").toString().trim();
  var cor = (fd.get("cor")||"").toString().trim();
  var tamanho = (fd.get("tamanho")||"").toString().trim();
  var unidade = fd.get("unidade");
  var quantidade = Number(fd.get("quantidade"));
  var minimo = Number(fd.get("minimo"))||0;
  if(!categoria || isNaN(quantidade)){ erro.textContent = "Informe categoria e quantidade válidas."; erro.style.display = "block"; return; }
  var idNovo = estoqueId(categoria,cor,tamanho);
  var dados = {categoria:categoria, cor:cor, tamanho:tamanho, unidade:unidade, quantidade:quantidade, minimo:minimo, atualizadoEm:new Date().toISOString()};
  var btn = box.querySelector('button[type="submit"]');
  btn.disabled = true;
  var acao;
  if(idNovo===idAntigo){
    acao = updateDoc(doc(db,"estoque",idAntigo), dados);
  } else {
    var existente = state.cache.estoque.filter(function(x){ return x.id===idNovo; })[0];
    if(existente){
      erro.textContent = "Já existe um item de estoque com essa categoria/cor/tamanho. Ajuste os dados dele diretamente em vez de renomear.";
      erro.style.display = "block"; btn.disabled = false; return;
    }
    dados.criadoEm = new Date().toISOString();
    acao = setDoc(doc(db,"estoque",idNovo), dados).then(function(){ return deleteDoc(doc(db,"estoque",idAntigo)); });
  }
  acao.then(function(){ toast("Item de estoque atualizado."); fecharModalPedido(); })

function excluirEstoque(id){
  var it = state.cache.estoque.filter(function(x){ return x.id===id; })[0];
  if(!it) return;
  if(!window.confirm('Excluir o item de estoque \"'+it.categoria+(it.cor?" "+it.cor:"")+(it.tamanho?" "+it.tamanho:"")+'\"? Essa ação não pode ser desfeita.')) return;
  deleteDoc(doc(db,"estoque",id)).then(function(){ toast("Item de estoque excluído."); fecharModalPedido(); })
    .catch(function(){ toast("Não foi possível excluir agora. Tente novamente."); });
}

  state.cache.estoque.forEach(function(it){ (grouped[it.categoria||"Sem categoria"] = grouped[it.categoria||"Sem categoria"]||[]).push(it); });
  var cats = Object.keys(grouped).sort();
  var linhas = "";
  var totalItens = 0;
  cats.forEach(function(cat){
    linhas += '<tr class="cat-row"><td colspan="5">'+esc(cat)+'</td></tr>';
    grouped[cat].sort(function(a,b){return (a.cor||"").localeCompare(b.cor||"");}).forEach(function(it){
      var baixo = (Number(it.quantidade)||0) <= (Number(it.minimo)||0);
      totalItens++;
      linhas += '<tr><td>'+esc(it.cor||"—")+'</td><td>'+esc(it.tamanho||"—")+'</td><td>'+esc(it.unidade||"un")+'</td>' +
        '<td style="text-align:right;">'+fmtNum(it.quantidade)+'</td>' +
        '<td>'+(baixo?"Baixo":"OK")+'</td></tr>';
    });
  });
  if(totalItens===0){ toast("Não há itens de estoque para exportar."); return; }
  var agora = new Date();
  var html =
    '<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><title>Relatório de Estoque - CaruFlex</title>' +
    '<style>' +
      'body{font-family:Arial,Helvetica,sans-serif;color:#161F27;padding:24px;}' +
      'h1{font-size:18px;margin:0 0 2px;}' +
      '.sub{color:#5B6873;font-size:12px;margin-bottom:18px;}' +
      'table{width:100%;border-collapse:collapse;font-size:12px;}' +
      'th,td{padding:6px 8px;border-bottom:1px solid #D9DFDA;text-align:left;}' +
      'th{background:#EAEEEA;text-transform:uppercase;font-size:10px;letter-spacing:.04em;}' +
      '.cat-row td{background:#F4F6F4;font-weight:700;padding-top:14px;}' +
      '@media print{ @page{ margin:16mm; } }' +
    '</style></head><body>' +
    '<div style="display:flex;align-items:center;gap:12px;margin-bottom:6px;">' +'<img src="'+LOGO_ESTOQUE_PDF+'" alt="CaruFlex" style="height:44px;width:auto;display:block;">' +'<h1 style="margin:0;">Relatório de Estoque — CaruFlex</h1></div>' +
    '<div class="sub">Gerado em '+agora.toLocaleDateString("pt-BR")+' às '+agora.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})+' · '+totalItens+' itens</div>' +
    '<table><thead><tr><th>Cor</th><th>Tamanho</th><th>Unidade</th><th style="text-align:right;">Quantidade</th><th>Situação</th></tr></thead><tbody>'+linhas+'</tbody></table>' +
    '</body></html>';
  var win = window.open("", "_blank");
  if(!win){ toast("Permita pop-ups para gerar o relatório."); return; }
  win.document.open(); win.document.write(html); win.document.close();
  setTimeout(function(){ win.focus(); win.print(); }, 300);
}

function readFileAsDataUrl(file){
  return new Promise(function(resolve,reject){
    var reader = new FileReader();
    reader.onload = function(){ resolve(reader.result); };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function submitPedido(form){
  var erro = $("#pedido-erro");
  erro.style.display = "none";
  var fd = new FormData(form);
  var clienteNome = (fd.get("clienteNome")||"").toString().trim();
  var itensValidos = novoPedidoItens.filter(function(it){ return it.categoria && Number(it.quantidade)>0; });
  if(!clienteNome){ erro.textContent="Informe o nome do cliente."; erro.style.display="block"; return; }
  if(itensValidos.length===0){ erro.textContent="Adicione ao menos um item com categoria e quantidade."; erro.style.display="block"; return; }
  var arteFile = $("#input-arte").files[0];
  if(arteFile && arteFile.size > TAMANHO_MAX_ARTE){
    erro.textContent = "O PDF da arte está muito grande (máx. 650KB). Comprima o arquivo e tente novamente.";
    erro.style.display = "block"; return;
  }
  var btn = $("#btn-enviar-pedido");
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Enviando…';

  var uploadPromise = arteFile ? readFileAsDataUrl(arteFile) : Promise.resolve(null);
  uploadPromise.then(function(dataUrl){
    var numero = orderNumero();
    var pedido = {
      numero: numero,
      criadoEm: new Date().toISOString(),
      criadoPor: state.user.nome || state.user.login,
      cliente: { nome: clienteNome, telefone: (fd.get("clienteTelefone")||"").toString(), endereco: (fd.get("clienteEndereco")||"").toString() },
      marca: (fd.get("marca")||"").toString(),
      tipoPedido: fd.get("tipoPedido"),
      alteracaoDescricao: (fd.get("alteracaoDescricao")||"").toString(),
      dataPedido: fd.get("dataPedido"),
      previsaoDias: fd.get("previsaoDias") ? Number(fd.get("previsaoDias")) : null,
      vendedor: (fd.get("vendedor")||"").toString(),
      produzidoPor: (fd.get("produzidoPor")||"").toString(),
      pigmento: (fd.get("pigmento")||"").toString(),
      corImpressao: (fd.get("corImpressao")||"").toString(),
      obs: (fd.get("obs")||"").toString(),
      itens: itensValidos.map(function(it){
        return {categoria:it.categoria, cor:it.cor||"", tamanho:it.tamanho||"", quantidade:Number(it.quantidade), unidade:it.unidade||"un", frente:it.frente||"", verso:it.verso||""};
      }),
      temArte: !!dataUrl, arteNome: arteFile ? arteFile.name : null,
      status: "enviado"
    };
    var baixas = pedido.itens.map(function(it){
      var id = estoqueId(it.categoria, it.cor, it.tamanho);
      return ajustarEstoque(id, it.categoria, it.cor, it.tamanho, it.unidade, -Math.abs(it.quantidade), true);
    });
    Promise.all(baixas).then(function(){
      return setDoc(doc(db,"pedidos",numero), pedido);
    }).then(function(){
      return dataUrl ? setDoc(doc(db,"artesPedidos",numero), {dataUrl:dataUrl, nome:arteFile.name, criadoEm:new Date().toISOString()}) : null;
    }).then(function(){
      toast("Ordem "+numero+" enviada para a produção.");
      novoPedidoItens = [{categoria:"",cor:"",tamanho:"",quantidade:"",unidade:"un",frente:"",verso:""}];
      state.view = "pedidos"; render();
    }).catch(function(){
      erro.textContent = "Não foi possível enviar a ordem agora. Tente novamente.";
      erro.style.display = "block";
      btn.disabled = false; btn.textContent = "Enviar para Produção";
    });
  });
}

function statusLabel(s){ return s==="enviado" ? "Enviado" : s==="recebido" ? "Recebido" : s==="concluido" ? "Concluído" : s; }
function abrirArte(numero){
  if(state.arteCache[numero]){ abrirBlobPdf(state.arteCache[numero]); return; }
  toast("Abrindo arte…");
  getDoc(doc(db,"artesPedidos",numero)).then(function(snap){
    if(!snap.exists()){ toast("Arte não encontrada."); return; }
    var dataUrl = snap.data().dataUrl;
    state.arteCache[numero] = dataUrl;
    abrirBlobPdf(dataUrl);
  }).catch(function(){ toast("Não foi possível abrir a arte agora."); });
}
function abrirBlobPdf(dataUrl){
  try{
    var parts = dataUrl.split(",");
    var byteChars = atob(parts[1]);
    var bytes = new Uint8Array(byteChars.length);
    for(var i=0;i<byteChars.length;i++) bytes[i]=byteChars.charCodeAt(i);
    var blob = new Blob([bytes], {type:"application/pdf"});
    window.open(URL.createObjectURL(blob), "_blank");
  }catch(e){ toast("Não foi possível abrir a arte."); }
}
function tipoPedidoLabel(t){
  return t==="primeiro" ? "1º Pedido" : t==="repeticao" ? "Repetição" : t==="novo" ? "Pedido Novo" : t==="alteracao" ? "Pedido com Alteração" : (t||"—");
}

function renderPedidos(){
  var box = el("div");
  box.appendChild(el("div", {}, '<div class="section-title">Pedidos</div><div class="section-sub">Histórico e acompanhamento de todas as ordens de produção.</div>'));
  var filters = el("div", {class:"filter-row"});
  [["todos","Todos"],["enviado","Enviados"],["recebido","Recebidos"],["concluido","Concluídos"]].forEach(function(f){
    var n = f[0]==="todos" ? 0 : countByStatus(f[0]);
    filters.appendChild(el("button", {"data-filtro":f[0], type:"button", class: state.filtroPedidos===f[0]?"active":""}, esc(f[1]) + (n ? ' <span class="count">'+n+'</span>' : "")));
  });
  box.appendChild(filters);
  var list = state.cache.pedidos.filter(function(p){ return state.filtroPedidos==="todos" || p.status===state.filtroPedidos; });
  var listWrap = el("div", {class:"stack"});
  if(list.length===0){ listWrap.appendChild(el("div",{class:"card empty-state"}, '<div class="glyph">🗂️</div>Nenhum pedido encontrado.')); }
  else { list.forEach(function(p){ listWrap.appendChild(renderPedidoCard(p)); }); }
  box.appendChild(listWrap);
  return box;
}
function confirmarStatus(numero, novoStatus){
  var campoPor = novoStatus==="recebido" ? "recebidoPor" : "concluidoPor";
  var campoEm = novoStatus==="recebido" ? "recebidoEm" : "concluidoEm";
  var patch = {status: novoStatus};
  patch[campoPor] = state.user.nome || state.user.login;
  patch[campoEm] = new Date().toISOString();
  updateDoc(doc(db,"pedidos",numero), patch).then(function(){
    toast("Ordem "+numero+" marcada como "+statusLabel(novoStatus)+".");
  }).catch(function(){ toast("Não foi possível atualizar agora. Tente novamente."); });
}

// ---------- EDITAR / EXCLUIR PEDIDO ----------
var editPedidoNumero = null;
var editPedidoItens = [];
function abrirEditarPedido(numero){
  var p = state.cache.pedidos.filter(function(x){ return x.numero===numero; })[0];
  if(!p){ toast("Pedido não encontrado."); return; }
  editPedidoNumero = numero;
  editPedidoItens = (p.itens||[]).map(function(it){ return Object.assign({}, it); });
  if(editPedidoItens.length===0) editPedidoItens.push({categoria:"",cor:"",tamanho:"",quantidade:"",unidade:"un",frente:"",verso:""});
  var modal = $("#modal-op");
  var box = $(".modal-box", modal);
  box.innerHTML =
    '<div class="modal-head"><div><div class="order-num">Editar '+esc(p.numero)+'</div></div>' +
    '<button class="modal-close" type="button" id="modal-op-fechar" aria-label="Fechar">&times;</button></div>' +
    '<form id="form-editar-pedido">' +
      '<div class="row">' +
        '<div class="field"><label>Nome do cliente *</label><input name="clienteNome" required value="'+esc(p.cliente && p.cliente.nome)+'"></div>' +
        '<div class="field"><label>Telefone</label><input name="clienteTelefone" value="'+esc(p.cliente && p.cliente.telefone)+'"></div>' +
      '</div>' +
      '<div class="field"><label>Endereço de entrega</label><input name="clienteEndereco" value="'+esc(p.cliente && p.cliente.endereco)+'"></div>' +
      '<div class="row">' +
        '<div class="field"><label>Marca</label><input name="marca" value="'+esc(p.marca)+'"></div>' +
        '<div class="field"><label>Tipo de pedido</label><select name="tipoPedido">' +
          ["primeiro","repeticao","novo","alteracao"].map(function(v){ return '<option value="'+v+'"'+(p.tipoPedido===v?" selected":"")+'>'+esc(tipoPedidoLabel(v))+'</option>'; }).join("") +
        '</select></div>' +
      '</div>' +
      '<div class="field" id="wrap-alteracao-edit" style="display:'+(p.tipoPedido==="alteracao"?"block":"none")+'"><label>Descrição da alteração</label><input name="alteracaoDescricao" value="'+esc(p.alteracaoDescricao)+'"></div>' +
      '<div class="row">' +
        '<div class="field"><label>Previsão de entrega (dias)</label><input name="previsaoDias" type="number" min="0" value="'+(p.previsaoDias!=null?esc(p.previsaoDias):"")+'"></div>' +
        '<div class="field"><label>Vendedor</label><input name="vendedor" value="'+esc(p.vendedor)+'"></div>' +
      '</div>' +
      '<div class="row">' +
        '<div class="field"><label>Produzido por</label><input name="produzidoPor" list="dl-producao-edit" value="'+esc(p.produzidoPor)+'"></div>' +
        '<div class="field"><label>Pigmento</label><input name="pigmento" value="'+esc(p.pigmento)+'"></div>' +
        '<div class="field"><label>Cor de impressão</label><input name="corImpressao" value="'+esc(p.corImpressao)+'"></div>' +
      '</div>' +
      '<datalist id="dl-producao-edit">' + state.cache.usuarios.filter(function(u){return u.setor==="producao";}).map(function(u){return '<option value="'+esc(u.nome||u.login)+'">';}).join("") + '</datalist>' +
      '<div class="field"><label>Observações</label><textarea name="obs" rows="2">'+esc(p.obs)+'</textarea></div>' +
      '<hr class="divider">' +
      '<label style="margin-bottom:10px;display:block;">Itens do pedido</label>' +
      '<div class="stack" id="edit-itens-container"></div>' +
      '<button class="btn btn-ghost btn-sm" id="btn-add-item-edit" type="button" style="margin-top:10px;">+ Adicionar item</button>' +
      '<hr class="divider">' +
      '<div id="editar-pedido-erro" class="error-msg" style="display:none;"></div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;">' +
        '<button class="btn btn-primary" type="submit" id="btn-salvar-edicao">Salvar alterações</button>' +
        '<button class="btn btn-ghost" type="button" id="btn-cancelar-edicao">Cancelar</button>' +
      '</div>' +
    '</form>' + datalists();
  renderEditItensRows();
  $("#modal-op-fechar", box).addEventListener("click", fecharModalPedido);
  $("#btn-cancelar-edicao", box).addEventListener("click", fecharModalPedido);
  $("#btn-add-item-edit", box).addEventListener("click", function(){ editPedidoItens.push({categoria:"",cor:"",tamanho:"",quantidade:"",unidade:"un",frente:"",verso:""}); renderEditItensRows(); });
  var tipoSelEdit = box.querySelector('select[name="tipoPedido"]');
  tipoSelEdit.addEventListener("change", function(){ $("#wrap-alteracao-edit", box).style.display = tipoSelEdit.value==="alteracao" ? "block" : "none"; });
  $("#form-editar-pedido", box).addEventListener("submit", function(e){ e.preventDefault(); salvarEdicaoPedido(box); });
  modal.hidden = false;
  requestAnimationFrame(function(){ modal.classList.add("show"); });
}
function renderEditItensRows(){
  var cont = $("#edit-itens-container");
  if(!cont) return;
  cont.innerHTML = "";
  editPedidoItens.forEach(function(it, idx){
    var row = el("div", {class:"item-row"});
    row.innerHTML =
      '<div class="item-row-head"><span class="idx">Item '+(idx+1)+'</span>' +
      (editPedidoItens.length>1 ? '<button class="btn btn-danger btn-sm" type="button" data-remove-eitem="'+idx+'">Remover</button>' : '') + '</div>' +
      '<div class="row">' +
        '<div class="field"><label>Categoria</label><input list="dl-categorias" data-eit="categoria" data-eidx="'+idx+'" value="'+esc(it.categoria)+'"></div>' +
        '<div class="field"><label>Cor</label><input list="dl-cores" data-eit="cor" data-eidx="'+idx+'" value="'+esc(it.cor)+'"></div>' +
        '<div class="field"><label>Tamanho</label><input list="dl-tamanhos" data-eit="tamanho" data-eidx="'+idx+'" value="'+esc(it.tamanho)+'" placeholder="ex: 30X40"></div>' +
      '</div>' +
      '<div class="row">' +
        '<div class="field"><label>Quantidade</label><input type="number" step="any" min="0" data-eit="quantidade" data-eidx="'+idx+'" value="'+esc(it.quantidade)+'"></div>' +
        '<div class="field"><label>Unidade</label><select data-eit="unidade" data-eidx="'+idx+'">' +
          ['un','kg','milheiro'].map(function(u){return '<option value="'+u+'"'+(it.unidade===u?" selected":"")+'>'+(u==='un'?'Unidades':u==='kg'?'Quilos (kg)':'Milheiro')+'</option>';}).join("") +
          '</select></div>' +
      '</div>' +
      '<div class="row">' +
        '<div class="field"><label>Impressão frente</label><input data-eit="frente" data-eidx="'+idx+'" value="'+esc(it.frente)+'"></div>' +
        '<div class="field"><label>Impressão verso</label><input data-eit="verso" data-eidx="'+idx+'" value="'+esc(it.verso)+'"></div>' +
      '</div>';
    cont.appendChild(row);
  });
  cont.querySelectorAll("[data-eit]").forEach(function(inp){
    inp.addEventListener("input", function(){ editPedidoItens[Number(inp.getAttribute("data-eidx"))][inp.getAttribute("data-eit")] = inp.value; });
  });
  cont.querySelectorAll("[data-remove-eitem]").forEach(function(b){
    b.addEventListener("click", function(){ editPedidoItens.splice(Number(b.getAttribute("data-remove-eitem")),1); renderEditItensRows(); });
  });
}
function salvarEdicaoPedido(box){
  var erro = $("#editar-pedido-erro", box);
  erro.style.display = "none";
  var form = $("#form-editar-pedido", box);
  var fd = new FormData(form);
  var clienteNome = (fd.get("clienteNome")||"").toString().trim();
  var itensValidos = editPedidoItens.filter(function(it){ return it.categoria && Number(it.quantidade)>0; });
  if(!clienteNome){ erro.textContent="Informe o nome do cliente."; erro.style.display="block"; return; }
  if(itensValidos.length===0){ erro.textContent="Adicione ao menos um item com categoria e quantidade."; erro.style.display="block"; return; }
  var numero = editPedidoNumero;
  var pOriginal = state.cache.pedidos.filter(function(x){ return x.numero===numero; })[0];
  var itensOriginais = (pOriginal && pOriginal.itens) || [];
  var btn = $("#btn-salvar-edicao", box);
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Salvando…';
  var itensFinais = itensValidos.map(function(it){
    return {categoria:it.categoria, cor:it.cor||"", tamanho:it.tamanho||"", quantidade:Number(it.quantidade), unidade:it.unidade||"un", frente:it.frente||"", verso:it.verso||""};
  });
  var patch = {
    cliente: { nome: clienteNome, telefone: (fd.get("clienteTelefone")||"").toString(), endereco: (fd.get("clienteEndereco")||"").toString() },
    marca: (fd.get("marca")||"").toString(),
    tipoPedido: fd.get("tipoPedido"),
    alteracaoDescricao: (fd.get("alteracaoDescricao")||"").toString(),
    previsaoDias: fd.get("previsaoDias") ? Number(fd.get("previsaoDias")) : null,
    vendedor: (fd.get("vendedor")||"").toString(),
    produzidoPor: (fd.get("produzidoPor")||"").toString(),
    pigmento: (fd.get("pigmento")||"").toString(),
    corImpressao: (fd.get("corImpressao")||"").toString(),
    obs: (fd.get("obs")||"").toString(),
    itens: itensFinais,
    editadoEm: new Date().toISOString(),
    editadoPor: state.user.nome || state.user.login
  };
  var mapa = {};
  itensOriginais.forEach(function(it){
    var id = estoqueId(it.categoria,it.cor,it.tamanho);
    if(!mapa[id]) mapa[id] = {categoria:it.categoria, cor:it.cor, tamanho:it.tamanho, unidade:it.unidade, antes:0, depois:0};
    mapa[id].antes += Number(it.quantidade)||0;
  });
  itensFinais.forEach(function(it){
    var id = estoqueId(it.categoria,it.cor,it.tamanho);
    if(!mapa[id]) mapa[id] = {categoria:it.categoria, cor:it.cor, tamanho:it.tamanho, unidade:it.unidade, antes:0, depois:0};
    mapa[id].depois += Number(it.quantidade)||0;
  });
  var ajustes = Object.keys(mapa).map(function(id){
    var m = mapa[id];
    var delta = m.antes - m.depois;
    if(!delta) return Promise.resolve();
    return ajustarEstoque(id, m.categoria, m.cor, m.tamanho, m.unidade, delta, true);
  });
  Promise.all(ajustes).then(function(){
    return updateDoc(doc(db,"pedidos",numero), patch);
  }).then(function(){
    toast("Ordem "+numero+" atualizada.");
    fecharModalPedido();
  }).catch(function(){
    erro.textContent = "Não foi possível salvar as alterações agora. Tente novamente.";
    erro.style.display = "block";
    btn.disabled = false; btn.textContent = "Salvar alterações";
  });
}
function excluirPedido(numero){
  var p = state.cache.pedidos.filter(function(x){ return x.numero===numero; })[0];
  if(!p) return;
  if(!window.confirm("Excluir a ordem "+numero+"? As sacolas usadas serão devolvidas ao estoque. Essa ação não pode ser desfeita.")) return;
  var devolucoes = (p.itens||[]).map(function(it){
    var id = estoqueId(it.categoria,it.cor,it.tamanho);
    return ajustarEstoque(id, it.categoria, it.cor, it.tamanho, it.unidade, Math.abs(Number(it.quantidade)||0), true);
  });
  Promise.all(devolucoes).then(function(){
    return deleteDoc(doc(db,"pedidos",numero));
  }).then(function(){
    return p.temArte ? deleteDoc(doc(db,"artesPedidos",numero)).catch(function(){}) : null;
  }).then(function(){
    toast("Ordem "+numero+" excluída.");
    fecharModalPedido();
  }).catch(function(){ toast("Não foi possível excluir agora. Tente novamente."); });
}

  var box = el("div", {class:"stack"});
  box.appendChild(el("div", {}, '<div class="section-title">Administração</div><div class="section-sub">Gerenciar usuários dos setores.</div>'));
  var formCard = el("div", {class:"card"});
  formCard.innerHTML =
    '<div class="section-title" style="font-size:15px;margin-bottom:10px;">Novo usuário</div>' +
    '<form id="form-usuario">' +
      '<div class="row">' +
        '<div class="field"><label>Usuário (login)</label><input name="login" required placeholder="ex: producao"></div>' +
        '<div class="field"><label>Nome</label><input name="nome" required></div>' +
      '</div>' +
      '<div class="row">' +
        '<div class="field"><label>Senha (mín. 6 caracteres)</label><input name="senha" minlength="6" required></div>' +
        '<div class="field"><label>Setor</label><select name="setor"><option value="comercial">Comercial</option><option value="producao">Produção</option><option value="admin">Admin</option></select></div>' +
      '</div>' +
      '<button class="btn btn-primary" type="submit">Criar usuário</button>' +
    '</form>';
  box.appendChild(formCard);
  var listCard = el("div", {class:"card"});
  var rows = state.cache.usuarios.map(function(u){
    return '<tr><td>'+esc(u.login)+'</td><td>'+esc(u.nome||"—")+'</td><td><span class="badge-role">'+esc(u.setor)+'</span></td></tr>';
  }).join("");
  listCard.innerHTML = '<table class="stock-table"><thead><tr><th>Login</th><th>Nome</th><th>Setor</th></tr></thead><tbody>'+(rows||'<tr><td colspan="3" style="color:var(--text-muted)">Nenhum usuário ainda.</td></tr>')+'</tbody></table>';
  box.appendChild(listCard);

}
function criarUsuario(login, nome, senha, setor){
  var email = loginParaEmail(login);
  var secApp = initializeApp(firebaseConfig, "secundario-"+Date.now());
  var secAuth = getAuth(secApp);
  return createUserWithEmailAndPassword(secAuth, email, senha).then(function(cred){
    var novoUid = cred.user.uid;
    return signOut(secAuth).then(function(){ return deleteApp(secApp); }).then(function(){
      return setDoc(doc(db,"perfis",novoUid), {login: login.trim().toLowerCase(), nome:nome, setor:setor});
    });
  }).catch(function(e){
    return deleteApp(secApp).catch(function(){}).then(function(){ throw e; });
  });
}

// ---------- wiring per view ----------
function wireViewEvents(root){
  var tipoPedidoSel = root.querySelector('select[name="tipoPedido"]');
  if(tipoPedidoSel) tipoPedidoSel.addEventListener("change", function(){ $("#wrap-alteracao").style.display = tipoPedidoSel.value==="alteracao" ? "block" : "none"; });
  var btnAddItem = $("#btn-add-item", root);
  if(btnAddItem) btnAddItem.addEventListener("click", function(){ novoPedidoItens.push({categoria:"",cor:"",tamanho:"",quantidade:"",unidade:"un",frente:"",verso:""}); renderItensRows(); });
  var formPedido = $("#form-pedido", root);
  if(formPedido) formPedido.addEventListener("submit", function(e){ e.preventDefault(); submitPedido(formPedido); });
  root.querySelectorAll("[data-filtro]").forEach(function(b){ b.addEventListener("click", function(){ state.filtroPedidos = b.getAttribute("data-filtro"); render(); }); });
  root.querySelectorAll("[data-confirmar]").forEach(function(b){
    b.addEventListener("click", function(){ b.disabled = true; b.innerHTML = '<span class="spinner"></span>'; confirmarStatus(b.getAttribute("data-confirmar"), b.getAttribute("data-alvo")); });
  });
  root.querySelectorAll("[data-ver-arte]").forEach(function(b){ b.addEventListener("click", function(){ abrirArte(b.getAttribute("data-ver-arte")); }); });
  root.querySelectorAll("[data-abrir-op]").forEach(function(c){
    c.addEventListener("click", function(e){
      if(e.target.closest("button")) return;
      abrirDetalhePedido(c.getAttribute("data-abrir-op"));
    });
  });
  root.querySelectorAll("[data-editar-pedido]").forEach(function(b){ b.addEventListener("click", function(){ abrirEditarPedido(b.getAttribute("data-editar-pedido")); }); });
  root.querySelectorAll("[data-excluir-pedido]").forEach(function(b){ b.addEventListener("click", function(){ excluirPedido(b.getAttribute("data-excluir-pedido")); }); });
  root.querySelectorAll("[data-editar-estoque]").forEach(function(b){ b.addEventListener("click", function(){ abrirEditarEstoque(b.getAttribute("data-editar-estoque")); }); });
  root.querySelectorAll("[data-excluir-estoque]").forEach(function(b){ b.addEventListener("click", function(){ excluirEstoque(b.getAttribute("data-excluir-estoque")); }); });
  var formEstoqueAdd = $("#form-estoque-add", root);
  if(formEstoqueAdd) formEstoqueAdd.addEventListener("submit", function(e){
    e.preventDefault();
    var fd = new FormData(formEstoqueAdd);
    var categoria = (fd.get("categoria")||"").toString().trim();
    var cor = (fd.get("cor")||"").toString().trim();
    var tamanho = (fd.get("tamanho")||"").toString().trim();
    var unidade = fd.get("unidade");
    var quantidade = Number(fd.get("quantidade"))||0;
    var minimo = Number(fd.get("minimo"))||0;
    if(!categoria || !quantidade){ toast("Informe categoria e quantidade."); return; }
    var id = estoqueId(categoria,cor,tamanho);
    var ref = doc(db,"estoque",id);
    getDoc(ref).then(function(snap){
      if(snap.exists()){ return updateDoc(ref, {quantidade:(Number(snap.data().quantidade)||0)+quantidade, minimo: minimo || snap.data().minimo || 0, unidade: unidade, atualizadoEm: new Date().toISOString()}); }
      else { return setDoc(ref, {categoria:categoria, cor:cor, tamanho:tamanho, unidade:unidade, quantidade:quantidade, minimo:minimo, criadoEm:new Date().toISOString(), atualizadoEm:new Date().toISOString()}); }
    }).then(function(){ toast("Estoque atualizado."); formEstoqueAdd.reset(); }).catch(function(){ toast("Não foi possível salvar agora."); });
  });
  root.querySelectorAll("[data-quick-adjust]").forEach(function(b){
    b.addEventListener("click", function(){
      var id = b.getAttribute("data-quick-adjust");
      var it = state.cache.estoque.find(function(x){return x.id===id;});
      if(!it) return;
      var v = window.prompt("Ajustar quantidade de "+it.categoria+" "+(it.cor||"")+" "+(it.tamanho||"")+"\nDigite a quantidade a somar (use negativo para subtrair):","0");
      if(v===null) return;
      var delta = Number(v);
      if(isNaN(delta) || delta===0) return;
      ajustarEstoque(id, it.categoria, it.cor, it.tamanho, it.unidade, delta, true).then(function(){ toast("Estoque ajustado."); });
    });
  });
  var formUsuario = $("#form-usuario", root);
  if(formUsuario) formUsuario.addEventListener("submit", function(e){
    e.preventDefault();
    var fd = new FormData(formUsuario);
    var login = (fd.get("login")||"").toString().trim();
    if(!login){ toast("Informe o login do usuário."); return; }
    var btn = formUsuario.querySelector('button[type="submit"]');
    btn.disabled = true;
    criarUsuario(login, (fd.get("nome")||"").toString(), (fd.get("senha")||"").toString(), fd.get("setor")).then(function(){
      toast("Usuário criado."); formUsuario.reset(); btn.disabled = false;
    }).catch(function(e){
      toast("Não foi possível criar (" + (e.code||"erro") + ")."); btn.disabled = false;
    });
  });
}

(function(){
  var modalOverlay = document.getElementById("modal-op");
  if(modalOverlay){
    modalOverlay.addEventListener("click", function(e){ if(e.target===modalOverlay) fecharModalPedido(); });
  }
  document.addEventListener("keydown", function(e){ if(e.key==="Escape") fecharModalPedido(); });
